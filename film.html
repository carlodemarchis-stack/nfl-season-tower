<style>
  :root{ --teal:#13b3a6; --teal-deep:#0e8f86; --teal-ink:#04211f; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#0e0f12;color:#fff;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  /* horizontal deck — full-bleed brand cards */
  .stage{position:fixed;inset:0;overflow:hidden;}
  .track{display:flex;height:100%;transition:transform .52s cubic-bezier(.22,.61,.36,1);}
  .slide{flex:0 0 100%;height:100%;}
  .card{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
    content-visibility:auto;contain-intrinsic-size:100vw 100vh;}
  /* the card either side of this one is painted up front, so the slide never
     catches a card mid-render; everything further away stays skipped */
  .slide.live>.card{content-visibility:visible;}
  .card .glow{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 75% at 12% 0%,rgba(255,255,255,.16),transparent 52%);pointer-events:none;}
  /* official team logo — very subtle watermark bleeding off the right edge */
  .logo-bg{position:absolute;z-index:0;right:-3%;top:50%;transform:translateY(-50%);height:82%;width:50%;pointer-events:none;
       display:flex;align-items:center;justify-content:center;
       -webkit-mask-image:linear-gradient(to left,#000 52%,transparent);mask-image:linear-gradient(to left,#000 52%,transparent);}
  /* soft contrasting plate so the logo reads even when its colours match the card */
  .logo-bg::before{content:'';position:absolute;height:104%;aspect-ratio:1;border-radius:50%;
       background:radial-gradient(circle at 50% 48%, rgba(var(--tone),.32), rgba(var(--tone),.12) 54%, transparent 72%);}
  .logo-bg img{position:relative;height:100%;max-width:100%;object-fit:contain;opacity:.3;}
  /* identity top bar */
  .topbar{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:48px 32px 13px;border-bottom:1px solid rgba(128,128,128,.22);}
  .tb-tile{width:58px;height:58px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;letter-spacing:.3px;box-shadow:0 3px 10px rgba(0,0,0,.28);padding:7px;overflow:hidden;}
  .tb-logo{width:100%;height:100%;object-fit:contain;}
  .tb-id{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .tb-name{font-weight:900;font-size:27px;line-height:1;letter-spacing:-.5px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .tb-zone{font-weight:800;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;padding:4px 11px;border-radius:999px;white-space:nowrap;}
  .tb-sub{font-weight:700;font-size:10px;opacity:.62;letter-spacing:.9px;text-transform:uppercase;}
  .tb-spacer{flex:1;}
  .tb-right{display:flex;align-items:center;gap:24px;flex:0 0 auto;}
  .tb-rankbig{display:flex;align-items:baseline;gap:3px;font-weight:900;line-height:1;}
  .tb-rankbig small{font-size:14px;opacity:.5;letter-spacing:.5px;}
  .tb-rankbig b{font-size:52px;letter-spacing:-2.5px;}
  .tb-rec{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5;}
  .tb-rec b{font-size:27px;}
  .tb-rec .pf{font-size:11px;opacity:.72;font-weight:700;letter-spacing:.2px;}
  /* body grid: matches | roster | season panel */
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(360px,44%) minmax(0,1fr);gap:30px;justify-content:stretch;padding:18px 32px 96px;flex:1;min-height:0;align-items:stretch;}
  .leftcol{display:flex;flex-direction:column;gap:16px;min-width:0;max-height:100%;}
  .lbl{font-weight:800;font-size:9px;letter-spacing:.6px;text-transform:uppercase;opacity:.6;padding:0 2px 6px;white-space:nowrap;}
  /* per-team tower: wins stack up (opponent colour), losses hang below the baseline */
  .tower{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0;--ch:clamp(15px,calc((100vh - 250px)/18),30px);}
  .tw-z{display:flex;flex-direction:column;}
  .tw-row{display:grid;grid-template-columns:minmax(0,1fr) 118px minmax(0,1fr);align-items:center;column-gap:6px;margin-bottom:2px;}
  .tw-c{grid-column:2;grid-row:1;width:118px;height:var(--ch);min-height:var(--ch);display:flex;align-items:center;gap:5px;padding:0 8px;border-radius:5px;box-sizing:border-box;font-weight:800;overflow:hidden;font-size:clamp(9px,calc(var(--ch)*.44),13px);line-height:1;}
  .tw-wk{font-size:.76em;opacity:.6;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:12px;}
  .tw-o{letter-spacing:.2px;white-space:nowrap;flex:0 0 auto;}
  .tw-o .at{opacity:.62;font-weight:700;font-size:.82em;margin-right:1px;}
  .tw-s{font-variant-numeric:tabular-nums;font-size:.9em;white-space:nowrap;flex:0 0 auto;margin-left:auto;}
  .tw-s i{font-style:normal;opacity:.5;padding:0 1px;}
  .tw-c.bye{border:1px dashed rgba(128,128,128,.5);opacity:.5;}
  .tw-c.up{opacity:.92;}
  .tw-gap{height:calc(var(--ch)*.55);}
  /* per-game point-differential bar: wins to the right of the tower, losses to the left */
  .tw-bar{grid-row:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;}
  .tw-bar.right{grid-column:3;justify-content:flex-start;}
  .tw-bar.left{grid-column:1;justify-content:flex-end;}
  .tw-bar i{height:calc(var(--ch)*.52);min-height:6px;border-radius:2px;flex:0 0 auto;}
  .tw-bar b{font-size:8.5px;font-weight:800;opacity:.72;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .tw-base{display:grid;grid-template-columns:minmax(0,1fr) 118px minmax(0,1fr);align-items:center;column-gap:6px;margin:3px 0;}
  .tw-rule{grid-column:2;height:0;border-top:2px dashed rgba(128,128,128,.55);}
  .tw-lbl{font-size:8px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.36;line-height:1;}
  .tw-lbl.lost{grid-column:1;justify-self:end;} .tw-lbl.won{grid-column:3;justify-self:start;}
  /* right column: tabbed roster (top) + visual splits (bottom) */
  .rightcol{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;height:100%;}
  .roster{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 0;}
  .rhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.62;flex:0 0 auto;}
  .rtabs{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:8px;}
  .rtab{border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.2px;cursor:pointer;color:inherit;font-family:inherit;background:rgba(128,128,128,.16);opacity:.66;border-bottom:2px solid transparent;transition:opacity .12s,background .12s;}
  .rtab:hover{opacity:.9;}
  .rtab b{font-weight:800;opacity:.55;margin-left:3px;}
  html[data-rtab="offense"] .rtab.offense,html[data-rtab="defense"] .rtab.defense,html[data-rtab="special"] .rtab.special,html[data-rtab="reserve"] .rtab.reserve{opacity:1;background:rgba(128,128,128,.32);border-bottom-color:currentColor;}
  .rcats{flex:1 1 0;min-height:0;overflow-y:auto;padding-right:4px;}
  .rcats::-webkit-scrollbar{width:6px;} .rcats::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:6px;}
  .rcat{display:none;}
  html[data-rtab="offense"] .rcat.offense,html[data-rtab="defense"] .rcat.defense,html[data-rtab="special"] .rcat.special,html[data-rtab="reserve"] .rcat.reserve{display:block;}
  .ph{font-weight:800;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;opacity:.6;padding:2px 6px 6px;}
  .pl{display:grid;grid-template-columns:20px 22px 1fr auto;align-items:center;gap:8px;min-height:24px;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:700;}
  .pl .num{font-variant-numeric:tabular-nums;opacity:.55;text-align:center;font-size:10px;}
  .pl .pic{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top center;flex:0 0 auto;box-shadow:0 0 0 1px rgba(128,128,128,.28);background:rgba(128,128,128,.2);}
  .pl .pn{letter-spacing:.1px;white-space:normal;line-height:1.08;overflow-wrap:break-word;min-width:0;}
  .pl .pos{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:5px;align-self:center;}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 14px;}
  .rna{opacity:.5;font-size:12px;padding:12px 6px;}
  /* visual season splits (below the roster) */
  .rpanel{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;min-width:0;}
  .splbars{display:flex;flex-direction:column;gap:8px;}
  .splrow{display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:11px;font-size:11px;font-weight:700;}
  .splrow .sl{opacity:.72;letter-spacing:.3px;text-transform:uppercase;font-size:9.5px;font-weight:800;}
  .spl-track{display:flex;height:13px;border-radius:4px;overflow:hidden;background:rgba(128,128,128,.2);}
  .spl-track i{height:100%;}
  .splrow .sv{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.3px;min-width:38px;text-align:right;}
  .stiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .stile{background:rgba(128,128,128,.15);border-radius:10px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .stile .k{font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.6;}
  .stile .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.2px;}
  /* bottom control bar (teal takeover) */
  /* ---- control bar: the family template (PGA / NBA / F1 films) ---- */
  #bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;
    background:rgba(14,16,20,.84);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 7px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);}
  #bar button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer;}
  #bar button:not(#count):not(#wk){width:34px;height:34px;border-radius:50%;display:grid;
    place-items:center;color:#9aa1ab;transition:.18s;}
  #bar button:not(#count):not(#wk):hover{background:rgba(255,255,255,.09);color:#fff;}
  #bar button:disabled{opacity:.28;pointer-events:none;}
  #bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;}
  #bar #b-play{background:var(--teal);color:var(--teal-ink);}
  #bar #b-play svg{fill:currentColor;stroke-width:1;}
  #bar #b-play:hover{background:#18c6b8;color:var(--teal-ink);}
  #count{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;
    color:#9aa1ab;padding:5px 12px;font-variant-numeric:tabular-nums;white-space:nowrap;
    border-radius:999px;border:1px solid transparent;transition:.18s;}
  #count:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;}
  #count b{color:#fff;font-weight:700;}
  #count .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  #count .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;}
  /* the match week is this film's own control -- the other films pick a season here */
  #wk{height:28px;border:1px solid rgba(255,255,255,.12);border-radius:999px;
    background:rgba(255,255,255,.05);color:var(--teal);font-family:inherit;font-weight:700;
    font-size:11px;letter-spacing:.06em;padding:0 8px;margin:0 2px;cursor:pointer;
    font-variant-numeric:tabular-nums;}
  #wk:hover{background:rgba(255,255,255,.1);}
  @media(max-width:700px){ #count .nm{display:none;} #bar{gap:2px;padding:4px 5px;} }
  @media(max-width:430px){
    #bar{gap:0;padding:4px;max-width:calc(100vw - 14px);}
    #bar button:not(#count):not(#wk){width:30px;height:30px;}
    #bar svg{width:14px;height:14px;}
    #count{padding:4px 7px;gap:6px;letter-spacing:.04em;}
    #wk{padding:0 5px;font-size:10px;margin:0;}
  }

  /* ---- modals: jump / help / more / credits ---- */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(6,8,12,.82);
    backdrop-filter:blur(10px);display:none;place-items:center;padding:4vw;}
  .modal.on{display:grid;}
  .mbox{position:relative;width:min(760px,94vw);max-height:90dvh;overflow-y:auto;
    background:linear-gradient(160deg,#171b22,#0c0f14);border:1px solid rgba(255,255,255,.1);
    border-radius:18px;padding:clamp(16px,2vw,26px);}
  .mclose{position:absolute;top:10px;right:12px;width:30px;height:30px;border:none;
    border-radius:9px;background:rgba(255,255,255,.07);color:#aeb4bd;font-size:17px;
    cursor:pointer;font-family:inherit;}
  .mclose:hover{background:rgba(255,255,255,.14);color:#fff;}
  .mbox h3{font-size:clamp(16px,2vw,24px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px;}
  .mbox h5{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);
    font-weight:800;margin:14px 0 5px;}
  .mbox p,.mbox li{font-size:13px;line-height:1.6;color:#aeb4bd;font-weight:500;}
  .mbox ul{padding-left:17px;} .mbox b{color:#fff;font-weight:700;}
  .mbox a{color:var(--teal);text-decoration:none;}
  #jq{width:100%;margin:14px 0 4px;padding:11px 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;
    font-family:inherit;font-size:15px;outline:none;}
  #jq:focus{border-color:var(--teal);}
  #jlist{max-height:58dvh;overflow-y:auto;margin-top:10px;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;align-content:start;}
  @media(max-width:640px){ #jlist{grid-template-columns:1fr;} }
  .jrow{display:grid;grid-template-columns:38px 10px minmax(0,1fr) auto;gap:9px;
    align-items:center;padding:6px 9px;border-radius:9px;cursor:pointer;font-size:12.5px;
    border:1px solid transparent;min-width:0;color:#e7e9ec;}
  .jrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .jrow:hover,.jrow.sel{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);}
  .jrow .jn{color:#7f868f;font-variant-numeric:tabular-nums;text-align:right;}
  .jrow .jd{width:10px;height:10px;border-radius:3px;}
  .jrow .jt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7f868f;}
  .jrow.sel .jn{color:var(--teal);}
  #mmodal .mbox{width:min(420px,94vw);}
  .applist{display:flex;flex-direction:column;gap:2px;margin-top:11px;}
  .applist a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;
    color:inherit;border:1px solid transparent;transition:.18s;}
  .applist a:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);}
  .applist i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;}
  .applist b{display:block;font-size:13.5px;font-weight:700;color:#fff;}
  .applist em{display:block;font-style:normal;font-size:11px;color:#7f868f;margin-top:1px;}
  .applist span{margin-left:auto;color:#7f868f;font-size:14px;font-weight:700;}
  .allapps{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;}
  /* section tabs, pinned above the deck */
  .sectabs{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:6px;
    align-items:center;padding:9px 14px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(180deg,rgba(14,15,18,.92),rgba(14,15,18,.55) 70%,transparent);}
  .sectabs::-webkit-scrollbar{display:none;}
  .sectab,.grptab{flex:0 0 auto;font-family:inherit;font-weight:800;cursor:pointer;
    border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.34);
    color:#fff;letter-spacing:.4px;white-space:nowrap;}
  .sectab{font-size:11px;padding:6px 14px;text-transform:uppercase;}
  a.sectab{display:inline-flex;align-items:center;text-decoration:none;}
  a.sectab:hover{border-color:var(--teal);color:#bdf2ec;}
  /* credit, right-aligned in the strip -- the same slot the other films use */
  .tb-cred{margin-left:auto;padding-left:18px;flex:0 0 auto;font-size:10.5px;font-weight:600;
    color:#8b929b;white-space:nowrap;}
  .tb-cred a{color:#b7bdc5;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.18);}
  .tb-cred a:hover{color:#fff;}
  @media(max-width:1100px){ .tb-cred{display:none;} }
  .sectab.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
  .grptab{font-size:10px;padding:5px 11px;opacity:.72;border-color:rgba(255,255,255,.14);}
  .grptab:hover{opacity:1;}
  .grptab.on{opacity:1;background:rgba(19,179,166,.22);border-color:var(--teal);color:#bdf2ec;}
  /* player card body: portrait beside the numbers his position is judged on */
  .pbody{position:relative;z-index:1;flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(200px,31%) minmax(0,1fr);gap:22px;
    padding:10px 32px 92px;align-items:stretch;}
  .pshot{position:relative;height:100%;min-height:0;display:flex;align-items:flex-end;
    justify-content:center;margin-bottom:-64px;}
  .pshot img{max-height:100%;width:100%;max-width:420px;object-fit:contain;object-position:bottom;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));}
  .pright{min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px;justify-content:center;}
  .pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:0 0 auto;}
  .pst{background:rgba(0,0,0,.17);border:1px solid rgba(128,128,128,.22);border-radius:14px;
    padding:11px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .pst b{font-size:clamp(20px,2.7vw,34px);font-weight:900;letter-spacing:-1px;line-height:1;
    font-variant-numeric:tabular-nums;}
  .pst span{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
    opacity:.62;}
  /* the season, game by game: bar length = the stat, side of the line = the result */
  .pchart{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .pc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;}
  .pc-t{opacity:.72;} .pc-max{opacity:.5;white-space:nowrap;}
  .pc-plot{position:relative;flex:1 1 auto;min-height:74px;max-height:360px;display:flex;align-items:stretch;
    gap:3px;padding:2px 0;}
  .pc-col{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;}
  .pc-h{min-height:0;display:flex;justify-content:center;}
  .pc-h.up{flex:var(--up,1) 1 0;align-items:flex-end;}
  .pc-h.dn{flex:var(--dn,1) 1 0;align-items:flex-start;}
  .pc-h i{width:100%;max-width:26px;border-radius:3px;display:block;}
  .pc-h.up i{border-radius:3px 3px 0 0;} .pc-h.dn i{border-radius:0 0 3px 3px;}
  .pc-wk{position:absolute;left:-4px;right:-4px;top:calc(var(--upPct,50%) - 7px);height:14px;line-height:14px;
    text-align:center;font-size:8.5px;font-weight:900;font-variant-numeric:tabular-nums;
    opacity:.62;pointer-events:none;
    text-shadow:0 0 3px var(--cardbg,transparent),0 0 3px var(--cardbg,transparent);}
  .pc-wk.bye,.pc-wk.out{opacity:.28;}
  .pc-rule{position:absolute;left:0;right:0;top:var(--upPct,50%);height:1.4px;background:currentColor;
    opacity:.38;}
  .pc-div{flex:0 0 auto;width:1.4px;margin:0 9px;background:currentColor;opacity:.45;position:relative;}
  .pc-div span{position:absolute;left:6px;top:20px;font-size:9px;font-weight:900;letter-spacing:.9px;
    text-transform:uppercase;opacity:.85;white-space:nowrap;}
  .pc-key{display:flex;gap:14px;font-size:8.5px;font-weight:800;letter-spacing:.9px;
    text-transform:uppercase;opacity:.5;}
  .pc-key .won::before,.pc-key .lost::before{content:'';display:inline-block;width:9px;height:9px;
    border-radius:2px;margin-right:5px;vertical-align:-1px;}
  .pc-key .won::before{background:currentColor;}
  .pc-key .lost::before{border:1.4px solid currentColor;}
  @media(max-width:980px){
    .grid{grid-template-columns:1fr;gap:16px;overflow-y:auto;align-items:start;padding-bottom:96px;}
    .rightcol{height:auto;} .roster{flex:0 0 auto;} .rcats{overflow:visible;}
    .rgrid{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:600px){ .rgrid{grid-template-columns:1fr;} .bar button.pos{min-width:120px;} .pos .nm{display:none;} }
  /* phones: the portrait shrinks to sit beside the numbers and the chart takes the
     full width underneath -- 18 weeks need every pixel they can get */
  @media(max-width:760px){
    .pcard .topbar{padding:44px 16px 10px;gap:11px;}
    .pcard .tb-tile{width:40px;height:40px;border-radius:10px;padding:5px;}
    .pcard .tb-name{font-size:19px;gap:7px;}
    .pcard .tb-sub{display:none;}
    .pcard .tb-right{gap:12px;}
    .pcard .tb-rankbig b{font-size:30px;letter-spacing:-1.5px;}
    .pcard .tb-rankbig small{font-size:10px;}
    .pcard .tb-rec{font-size:12px;} .pcard .tb-rec .pf{font-size:8.5px;}
    .pbody{grid-template-columns:114px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
      gap:10px 12px;padding:8px 16px 84px;}
    .pright{display:contents;}
    .pshot{grid-column:1;grid-row:1;margin-bottom:0;align-items:center;}
    .pshot img{max-width:114px;}
    .pstats{grid-column:2;grid-row:1;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
    .pst{padding:7px 9px;border-radius:10px;gap:2px;}
    .pst b{font-size:17px;letter-spacing:-.5px;}
    .pst span{font-size:7.5px;letter-spacing:.4px;}
    .pchart{grid-column:1/-1;grid-row:2;}
    .pc-plot{max-height:none;} .pc-h i{max-width:14px;} .pc-col{gap:0;}
    .pc-wk{font-size:7px;} .pc-div{margin:0 5px;} .pc-div span{font-size:7.5px;left:4px;}
  }
</style>
</head>
<body>

<script type="module">
import { TEAMS2025 as TEAMS, RESULTS2025 as RESULTS } from './src/data/schedule-2025.js'
import { ROSTERS2025 as ROSTERS } from './src/data/rosters-2025.js'
import { PLAYERS2025 as PLAYERS } from './src/data/players-2025.js'

const TEAL='#13b3a6', RED='#ef4b52', AMBER='#d9a13a'

/* ---- colour helpers ---- */
const hx=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const to=([r,g,b])=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return to([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t])}
const lum=h=>{const[r,g,b]=hx(h);return(r*299+g*587+b*114)/1000}
const ink=h=>lum(h)>150?'#12151a':'#ffffff'
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
// encodeURIComponent leaves single quotes intact, which would break the single-quoted
// onerror JS string — replace them so the data URI is safe to inline.
const SIL="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='42' height='42'><rect width='42' height='42' rx='21' fill='#2a2d34'/><circle cx='21' cy='16' r='7' fill='#565c66'/><path d='M7 40c1.5-9 26.5-9 28 0z' fill='#565c66'/></svg>").replace(/'/g,"%27")

const DIVNAME={N:'North',S:'South',E:'East',W:'West'}
const POS_ORDER=['QB','RB','FB','WR','TE','T','OT','LT','RT','G','OG','LG','RG','C','OL','LS','DE','DT','NT','DL','EDGE','OLB','ILB','MLB','LB','CB','S','FS','SS','DB','K','P']
const posRank=p=>{const i=POS_ORDER.indexOf(p);return i<0?99:i}
const UNITS=[['offense','Offense'],['defense','Defense'],['specialTeam','Special Teams'],['injuredReserveOrOut','Reserve / Out']]

const MAXW=18
let curWeek=MAXW
// "Through week X" model, exactly like the Season Tower: weeks after X are still to play
// (rendered as upcoming tower cells) and do not count toward standings. No simulation.
const resOf=(abbr,w)=> (w<=curWeek ? (RESULTS[abbr+':'+w]||null) : null)

/* ---- per-team stats through the selected week (values only) ---- */
let stat={}, ranked=[], seed={}
function computeStats(week){
  curWeek=week; stat={}
  for(const abbr in TEAMS){
    const t=TEAMS[abbr]
    const st={W:0,L:0,T:0,PF:0,PA:0,played:0,home:{W:0,L:0,T:0},away:{W:0,L:0,T:0},div:{W:0,L:0,T:0}}
    const games=[]
    for(const g of t.games){ const r=resOf(abbr,g.w); if(!r) continue
      st.played++; st.PF+=r.us; st.PA+=r.them
      const kk=r.res==='W'?'W':r.res==='L'?'L':'T'; st[kk]++
      st[g.ha==='H'?'home':'away'][kk]++
      const o=TEAMS[g.opp]; if(o&&o.conf===t.conf&&o.div===t.div) st.div[kk]++
      games.push({w:g.w,res:r.res})
    }
    games.sort((a,b)=>a.w-b.w)
    let cur=0,mx=0; for(const p of games){ if(p.res==='W'){cur++;mx=Math.max(mx,cur)} else cur=0 }
    st.streak=mx; st.pct=st.played?(st.W+0.5*st.T)/st.played:0; st.diff=st.PF-st.PA
    stat[abbr]=st
  }
}
// Deck order + playoff seeds are FROZEN from the full season — changing the week only updates
// each card's values in place, so the cards never reshuffle.
function freezeRanking(){
  ranked=Object.keys(TEAMS).sort((a,b)=>{
    const A=stat[a],B=stat[b]
    if(B.pct!==A.pct) return B.pct-A.pct
    if(B.W!==A.W) return B.W-A.W
    if(A.L!==B.L) return A.L-B.L
    return a<b?-1:1
  })
  seed={}
  for(const conf of ['AFC','NFC']){
    const confTeams=ranked.filter(a=>TEAMS[a].conf===conf)
    const seen={}, winners=[]
    for(const a of confTeams){ const d=TEAMS[a].div; if(!seen[d]){ seen[d]=1; winners.push(a) } }
    winners.forEach((a,i)=>seed[a]={n:i+1,kind:'div'})
    confTeams.filter(a=>!winners.includes(a)).slice(0,3).forEach((a,i)=>seed[a]={n:i+5,kind:'wc'})
  }
}
const rec=s=>`${s.W}-${s.L}${s.T?'-'+s.T:''}`

/* ---- card pieces ---- */
function twScore(r){ const w=r.us>r.them
  return `<b style="${w?'':'opacity:.6;font-weight:700'}">${r.us}</b><i>–</i><b style="${w?'opacity:.6;font-weight:700':''}">${r.them}</b>` }
function towerCell(abbr,ty,g,I,soft,maxDiff){
  if(ty==='bye') return `<div class="tw-row"><div class="tw-c bye" style="color:${I}" title="Week ${g.w} · Bye"><span class="tw-wk">${g.w}</span><span class="tw-o">BYE</span></div></div>`
  if(ty==='up'){ // still-to-play game — tower "upcoming" style: white cell, opponent-colour text
    const o2=TEAMS[g.opp], op2=(o2&&o2.primary)||'#8A8F98', at2=g.ha==='A'?'<span class="at">@</span>':''
    return `<div class="tw-row"><div class="tw-c up" style="background:#ffffff;color:${op2};border:1px solid ${mix(op2,'#ffffff',.55)}" title="Wk ${g.w} · ${g.ha==='A'?'@ ':'vs '}${g.oppFull} · to play"><span class="tw-wk">${g.w}</span><span class="tw-o">${at2}${g.opp}</span><span class="tw-s" style="opacity:.4">–</span></div></div>`
  }
  const r=resOf(abbr,g.w), o=TEAMS[g.opp], op=(o&&o.primary)||'#8A8F98', diff=r.us-r.them
  let bg,color,bd
  if(ty==='win'){ bg=op; color=ink(op); bd='1px solid rgba(0,0,0,.18)' }
  else if(ty==='loss'){ bg='#ffffff'; color=op; bd='1.6px solid '+RED }
  else { bg=mix(op,'#ffffff',.18); color=ink(bg); bd='1px solid rgba(0,0,0,.12)' }
  const at=g.ha==='A'?'<span class="at">@</span>':''
  const barW=Math.max(3,Math.round(Math.abs(diff)/maxDiff*90))
  const sign=diff>0?'+':diff<0?'−':'±'
  const title=`Wk ${g.w} · ${g.ha==='A'?'@ ':'vs '}${g.oppFull} · ${ty==='tie'?'Tied '+r.us+'-'+r.them:r.res+' '+r.us+'-'+r.them+' ('+sign+Math.abs(diff)+')'}`
  const barI=`<i style="width:${barW}px;background:${op};box-shadow:0 0 0 1px rgba(${soft},.16)"></i>`
  const barB=`<b style="color:${I}">${sign}${Math.abs(diff)}</b>`
  const bar = ty==='tie'
    ? `<span class="tw-bar right" title="Tied"><b style="color:${I};opacity:.66;letter-spacing:.4px">TIED</b></span>`
    : ty==='loss'
      ? `<span class="tw-bar left" title="${sign}${Math.abs(diff)} pts">${barB}${barI}</span>`
      : `<span class="tw-bar right" title="${sign}${Math.abs(diff)} pts">${barI}${barB}</span>`
  return `<div class="tw-row"><div class="tw-c" style="background:${bg};color:${color};border:${bd};box-shadow:0 0 0 1px rgba(${soft},.12)" title="${title}"><span class="tw-wk">${g.w}</span><span class="tw-o">${at}${g.opp}</span><span class="tw-s">${twScore(r)}</span></div>${bar}</div>`
}
// One team's tower: wins+ties above the baseline (calendar order, latest on top),
// losses below (earliest nearest the baseline), bye at the ceiling. Any week>18 game
// (postseason) buckets naturally into wins/losses, so the slot is future-proof.
function towerCol(abbr,I,soft){
  const t=TEAMS[abbr]
  const wins=[],losses=[],ties=[],upc=[]; const wk=new Set(); let maxDiff=1
  for(const g of t.games){ if(g.w<=18) wk.add(g.w); const r=resOf(abbr,g.w)
    if(!r){ upc.push(g); continue }                      // week > selected -> to play
    maxDiff=Math.max(maxDiff,Math.abs(r.us-r.them))
    if(r.res==='W')wins.push(g); else if(r.res==='L')losses.push(g); else ties.push(g) }
  let bye=null; for(let w=1;w<=18;w++){ if(!wk.has(w)){ bye=w; break } }
  // wins on top (week desc), then ties sitting right on the line between wins and losses
  const above=[...[...wins].sort((a,b)=>b.w-a.w).map(g=>['win',g]), ...[...ties].sort((a,b)=>b.w-a.w).map(g=>['tie',g])]
  const below=[...losses].sort((a,b)=>a.w-b.w)
  // ceiling: to-play games + the bye, latest week on top (tower "upcoming" block)
  const ceil=[...upc.map(g=>['up',g]), ...(bye?[['bye',{w:bye}]]:[])].sort((a,b)=>b[1].w-a[1].w)
  let top=''; ceil.forEach(([ty,g])=>top+=towerCell(abbr,ty,g,I,soft,maxDiff))
  let play=''; above.forEach(([ty,g])=>play+=towerCell(abbr,ty,g,I,soft,maxDiff))
  const gap=(upc.length&&play)?'<div class="tw-gap"></div>':''   // separate upcoming from the played tower
  let dn=''; below.forEach(g=>dn+=towerCell(abbr,'loss',g,I,soft,maxDiff))
  return `<div class="tower"><div class="tw-z">${top}${gap}${play}</div><div class="tw-base"><span class="tw-lbl lost">Lost</span><span class="tw-rule"></span><span class="tw-lbl won">Won</span></div><div class="tw-z">${dn}</div></div>`
}
const CATS=[['offense','offense','Offense'],['defense','defense','Defense'],['specialTeam','special','Special'],['injuredReserveOrOut','reserve','Reserve']]
function rosterCol(abbr,I,soft){
  const R=ROSTERS[abbr]
  const head=`<div class="rhead"><span>Roster</span><span>${R?R.count:0} players</span></div>`
  if(!R) return `<div class="roster">${head}<div class="rna">Roster data unavailable for this season.</div></div>`
  let tabs='', cats=''
  CATS.forEach(([u,cls,label])=>{
    const ps=R.players.filter(p=>p.u===u).sort((a,b)=>posRank(a.pos)-posRank(b.pos)||(+(a.j||999))-(+(b.j||999)))
    if(!ps.length) return
    tabs+=`<button class="rtab ${cls}" data-tab="${cls}">${label}<b>${ps.length}</b></button>`
    let grid=''
    ps.forEach(p=>{ grid+=`<div class="pl" style="background:rgba(${soft},.07);color:${I}"><span class="num">${p.j||''}</span><img class="pic" loading="lazy" src="https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png" onerror="this.onerror=null;this.src='${SIL}'"><span class="pn">${p.n}</span><span class="pos" style="background:rgba(${soft},.14)">${p.pos}</span></div>` })
    cats+=`<div class="rcat ${cls}"><div class="rgrid">${grid}</div></div>`
  })
  return `<div class="roster">${head}<div class="rtabs">${tabs}</div><div class="rcats">${cats}</div></div>`
}
function panel(abbr,I,soft){
  const s=stat[abbr]
  const bar=(lbl,d)=>{ const tot=(d.W+d.L+d.T)||1
    return `<div class="splrow"><span class="sl">${lbl}</span><div class="spl-track">`+
      `<i style="width:${d.W/tot*100}%;background:${TEAL}"></i><i style="width:${d.T/tot*100}%;background:${AMBER}"></i><i style="width:${d.L/tot*100}%;background:${RED}"></i></div>`+
      `<span class="sv">${rec(d)}</span></div>` }
  const tile=(k,v)=>`<div class="stile" style="background:rgba(${soft},.13)"><span class="k">${k}</span><span class="v">${v}</span></div>`
  return `<div class="rpanel"><div class="ph">Season splits</div>
    <div class="splbars">${bar('Home',s.home)}${bar('Away',s.away)}${bar('Division',s.div)}</div>
    <div class="stiles">${tile('PF',s.PF)}${tile('PA',s.PA)}${tile('Diff',(s.diff>=0?'+':'')+s.diff)}${tile('Streak',s.streak)}</div>
  </div>`
}

/* ---- build the deck ---- */
const track=document.getElementById('track')
/* The deck: every leader first, grouped by position, then the 32 club cards.
   DECK is the single source of truth for order, so navigation, the jump menu, the
   section tabs and the hash all read from the same list and cannot disagree. */
let DECK=[]
function buildDeck(){
 track.innerHTML=''
 DECK=[]
 PLAYERS.groups.forEach(g=>{
  g.ids.forEach((pid,i)=>{
   const pl=PLAYERS.players[pid]; if(!pl) return
   const slide=el('div','slide'); slide.appendChild(playerCard(pl,g.label,i+1))
   track.appendChild(slide)
   DECK.push({kind:'player',id:pid,group:g.key,label:g.label,name:pl.n,
              team:pl.team,rank:i+1})
  })
 })
 ranked.forEach((abbr,idx)=>{
  const t=TEAMS[abbr], prim=t.primary, I=ink(prim), soft=(I==='#ffffff'?'255,255,255':'0,0,0'), s=stat[abbr]
  const sd=seed[abbr]
  const divTxt=`${t.conf} ${DIVNAME[t.div]||t.div}`
  const zone = sd
    ? `<span class="tb-zone" style="background:${sd.kind==='div'?TEAL:'rgba('+soft+',.14)'};color:${sd.kind==='div'?'#06211d':I};box-shadow:${sd.kind==='wc'?'inset 0 0 0 1.4px '+TEAL:'none'}">${sd.kind==='div'?'★ '+divTxt+' · #'+sd.n:'Wild Card · #'+sd.n}</span>`
    : `<span class="tb-zone" style="background:rgba(${soft},.12);color:${I};opacity:.85">${divTxt}</span>`

  const card=el('div','card')
  card.style.background=`linear-gradient(150deg, ${mix(prim,'#ffffff',0.20)} 0%, ${prim} 47%, ${mix(prim,'#000000',0.20)} 100%)`
  card.style.color=I
  card.innerHTML=`<div class="glow"></div>
    <div class="logo-bg" style="--tone:${I==='#ffffff'?'255,255,255':'18,20,26'}"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png" alt="" onerror="this.closest('.logo-bg').remove()"></div>
    <div class="topbar">
      <div class="tb-tile" style="background:rgba(255,255,255,.94);color:${prim}"><img class="tb-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png" alt="${abbr}" onerror="this.onerror=null;this.parentNode.textContent='${abbr}'"></div>
      <div class="tb-id"><div class="tb-name">${t.name} ${zone}</div>
        <div class="tb-sub">NFL · 2025 · ${curWeek>=MAXW?'Season Film':'Through Wk '+curWeek} · ${(ROSTERS[abbr]&&ROSTERS[abbr].coach)||'—'}</div></div>
      <div class="tb-spacer"></div>
      <div class="tb-right">
        <span class="tb-rankbig"><small>#</small><b>${idx+1}</b></span>
        <div class="tb-rec"><b>${rec(s)}</b><br><span class="pf">${s.PF} PF · ${s.PA} PA · ${(s.diff>=0?'+':'')}${s.diff}</span></div>
      </div>
    </div>
    <div class="grid">
      <div class="leftcol"><div class="lbl">Season tower · wins ↑ · losses ↓ · opponent colour</div>${towerCol(abbr,I,soft)}</div>
      <div class="rightcol">${rosterCol(abbr,I,soft)}${panel(abbr,I,soft)}</div>
    </div>`
  const slide=el('div','slide'); slide.appendChild(card); track.appendChild(slide)
  DECK.push({kind:'team',abbr,name:t.name,rank:idx+1})
 })
}

/* ---- player cards -------------------------------------------------------------
   Each group shows the numbers its position is actually judged on: a corner's card
   has no rushing yards on it, a punter's has no touchdowns. [label, category, stat,
   decimals] -- a null stat means "derive it", handled in statVal below. */
const STATSET={
  qb:[['Yards','passing','passingYards',0],['TD','passing','passingTouchdowns',0],
      ['INT','passing','interceptions',0],['Comp %','passing','completionPct',1],
      ['Yds/att','passing','yardsPerPassAttempt',1],['Rating','passing','QBRating',1]],
  rb:[['Rush yds','rushing','rushingYards',0],['TD','rushing','rushingTouchdowns',0],
      ['Yds/carry','rushing','yardsPerRushAttempt',1],['Carries','rushing','rushingAttempts',0],
      ['Longest','rushing','longRushing',0],['Rec yds','receiving','receivingYards',0]],
  wr:[['Rec yds','receiving','receivingYards',0],['Catches','receiving','receptions',0],
      ['TD','receiving','receivingTouchdowns',0],['Yds/catch','receiving','yardsPerReception',1],
      ['After catch','receiving','receivingYardsAfterCatch',0],['Longest','receiving','longReception',0]],
  dl:[['Sacks','defensive','sacks',1],['Tackles for loss','defensive','tacklesForLoss',0],
      ['Tackles','defensive','totalTackles',0],['Solo','defensive','soloTackles',0],
      ['Passes def','defensive','passesDefended',0],['Forced fum','general','fumblesForced',0]],
  lb:[['Tackles','defensive','totalTackles',0],['Solo','defensive','soloTackles',0],
      ['Sacks','defensive','sacks',1],['Tackles for loss','defensive','tacklesForLoss',0],
      ['Passes def','defensive','passesDefended',0],['Int','defensiveinterceptions','interceptions',0]],
  db:[['Passes def','defensive','passesDefended',0],['Int','defensiveinterceptions','interceptions',0],
      ['Tackles','defensive','totalTackles',0],['Solo','defensive','soloTackles',0],
      ['Int yards','defensiveinterceptions','interceptionYards',0],
      ['Forced fum','general','fumblesForced',0]],
  pk:[['FG made','kicking','fieldGoalsMade',0],['Attempts','kicking','fieldGoalAttempts',0],
      ['FG %','kicking','fieldGoalPct',1],['Longest','kicking','longFieldGoalMade',0],
      ['From 50+','kicking','fieldGoalsMade50',0],['Extra pts','kicking','extraPointsMade',0]],
  p:[['Gross avg','punting','grossAvgPuntYards',1],['Net avg','punting','netAvgPuntYards',1],
     ['Punts','punting','punts',0],['Inside 20','punting','puntsInside20',0],
     ['Longest','punting','longPunt',0],['Touchbacks','punting','touchbacks',0]],
}
const gkeyOf=p=> p.pos==='P' ? 'p' : (p.pos==='PK'||p.pos==='K') ? 'pk'
  : (PLAYERS.groups.find(g=>g.ids.includes(p.id))||{}).key || 'qb'
const setFor=p=> STATSET[gkeyOf(p)] || STATSET.qb
const statVal=(p,cat,key)=>{ const v=(p.st[cat]||{})[key]; return (v==null)?null:v }
const fmtStat=(v,dp)=> v==null ? '—'
  : (dp?Number(v).toFixed(dp):Math.round(v).toLocaleString('en-US'))

/* The one number each group's season is told through, game by game.
   Cornerbacks are ranked on passes defended but charted on tackles: a chart of
   0s and 1s says nothing, and tackles is the stat a corner posts every week. */
const CHARTSTAT={ qb:['passingYards','Passing yards'], rb:['rushingYards','Rushing yards'],
  wr:['receivingYards','Receiving yards'], dl:['sacks','Sacks'], lb:['totalTackles','Tackles'],
  db:['totalTackles','Tackles'], pk:['totalKickingPoints','Kicking points'],
  p:['puntsInside20','Punts inside the 20'] }
const PORND={1:'WC',2:'DIV',3:'CC',5:'SB'}
const gameVal=(p,g,key)=>{ const names=PLAYERS.sigs[p.s]||[]; const i=names.indexOf(key)
  return i<0 ? null : g.v[i] }

/* A player's season in the tower idiom: one bar per game, its LENGTH the stat and its
   SIDE the result -- wins above the line, losses below, in the opponent's colour. So a
   career game in a defeat hangs, and a quiet win sits small on top. Weeks he did not
   play stay as empty slots, because an absence is part of the season too. */
function playerChart(p,I,soft){
  const [key,label]=CHARTSTAT[gkeyOf(p)]||CHARTSTAT.qb
  const log=p.g||[]; if(!log.length) return ''
  const byWk={}; log.forEach(g=>{ if(!g.p) byWk[g.w]=g })
  const post=log.filter(g=>g.p)
  const sched=(TEAMS[p.team]||{}).games||[]
  const weeks=new Set(sched.map(g=>g.w).filter(w=>w<=18))
  const slots=[]
  for(let w=1;w<=18;w++){
    if(byWk[w]) slots.push(['g',byWk[w],w])
    else slots.push([weeks.has(w)?'out':'bye',null,w])
  }
  if(post.length){ slots.push(['div',null,null]); post.forEach(g=>slots.push(['g',g,g.w])) }
  let up=0,dn=0; log.forEach(g=>{ const v=gameVal(p,g,key)||0
    if(g.r==='W'){ if(v>up) up=v } else if(v>dn) dn=v })
  const max=Math.max(up,dn,1)
  const best=log.reduce((a,g)=>(gameVal(p,g,key)||0)>(gameVal(p,a,key)||0)?g:a,log[0])
  const cols=slots.map(([ty,g,w])=>{
    if(ty==='div') return `<div class="pc-div"><span>Playoffs</span></div>`
    if(!g) return `<div class="pc-col"><div class="pc-h up"></div><div class="pc-h dn"></div>`
      +`<div class="pc-wk ${ty}" title="Week ${w} · ${ty==='bye'?'Bye week':'Did not play'}">${ty==='bye'?'·':'–'}</div></div>`
    const v=gameVal(p,g,key)||0, win=g.r==='W'
    const o=TEAMS[g.o]||{}, op=o.primary||'#8A8F98'
    // one scale for the whole chart: each half is as tall as its own biggest game,
    // so a bar's pixels mean the same above and below the line
    const h=Math.max(v>0?4:0,Math.round(v/(win?up||max:dn||max)*100))
    // same grammar as the tower: a win is a solid block in the opponent's colour,
    // a loss is the pale ghost of one, outlined in it
    const bar=`<i style="height:${h}%;background:${win?op:mix(op,I,.74)};`
      +`border:1.8px solid ${win?'rgba('+soft+',.18)':op};box-shadow:0 0 0 1px rgba(${soft},.10)"></i>`
    const ttl=`${g.p?(g.t||'Playoffs'):'Week '+w} · ${g.h?'vs ':'@ '}${g.o} · ${g.r} ${g.s} · `
      +`${fmtStat(v,key==='sacks'?1:0)} ${label.toLowerCase()}`
    return `<div class="pc-col" title="${ttl}">`
      +`<div class="pc-h up">${win?bar:''}</div><div class="pc-h dn">${win?'':bar}</div>`
      +`<div class="pc-wk">${g.p?(PORND[w]||'P'):w}</div></div>`
  }).join('')
  return `<div class="pchart">
    <div class="pc-head"><span class="pc-t">${label}, game by game</span>
      <span class="pc-max">Best ${fmtStat(gameVal(p,best,key),key==='sacks'?1:0)} ${best.h?'vs ':'@ '}${best.o}</span></div>
    <div class="pc-plot" style="--up:${(up/max).toFixed(3)};--dn:${(dn/max).toFixed(3)};--upPct:${(up/(up+dn||1)*100).toFixed(1)}%">${cols}<div class="pc-rule"></div></div>
    <div class="pc-key"><span class="won">Won</span><span class="lost">Lost</span></div>
  </div>`
}

/* One card per leader, in the team's colours so a player reads as part of his club. */
function playerCard(p, gLabel, rank){
  const t=TEAMS[p.team]||{}, prim=t.primary||'#3a3f47', I=ink(prim)
  const soft=(I==='#ffffff'?'255,255,255':'0,0,0')
  const games=statVal(p,'general','gamesPlayed')
  const card=el('div','card pcard')
  card.style.setProperty('--cardbg',prim)
  card.style.background=`linear-gradient(150deg, ${mix(prim,'#ffffff',0.20)} 0%, ${prim} 47%, ${mix(prim,'#000000',0.20)} 100%)`
  card.style.color=I
  card.innerHTML=`<div class="glow"></div>
    <div class="logo-bg" style="--tone:${I==='#ffffff'?'255,255,255':'18,20,26'}"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team||'').toLowerCase()}.png" alt="" onerror="this.closest('.logo-bg').remove()"></div>
    <div class="topbar">
      <div class="tb-tile" style="background:rgba(255,255,255,.94);color:${prim}"><img class="tb-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team||'').toLowerCase()}.png" alt="${p.team}" onerror="this.onerror=null;this.parentNode.textContent='${p.team}'"></div>
      <div class="tb-id"><div class="tb-name">${p.n} <span class="tb-zone" style="background:rgba(${soft},.14);color:${I}">${p.pos} · ${p.team}</span></div>
        <div class="tb-sub">NFL · 2025 · ${gLabel} · #${rank} by ${gLabel.toLowerCase()==='specialists'?'their board':'the group stat'}</div></div>
      <div class="tb-spacer"></div>
      <div class="tb-right">
        <span class="tb-rankbig"><small>#</small><b>${rank}</b></span>
        <div class="tb-rec"><b>${games!=null?games:'—'}</b><br><span class="pf">games played</span></div>
      </div>
    </div>
    <div class="pbody">
      <div class="pshot"><img src="https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png" alt="${p.n}" onerror="this.style.display='none'"></div>
      <div class="pright">
        <div class="pstats">${setFor(p).map(([lab,cat,key,dp])=>`
          <div class="pst"><b>${fmtStat(statVal(p,cat,key),dp)}</b><span>${lab}</span></div>`).join('')}</div>
        ${playerChart(p,I,soft)}
      </div>
    </div>`
  return card
}

/* ---- film controls ---- */
const N=()=>DECK.length
const firstOf=kind=>Math.max(0,DECK.findIndex(c=>c.kind===kind))
const firstGroup=key=>Math.max(0,DECK.findIndex(c=>c.group===key))
const $=id=>document.getElementById(id)
let idx=0, playing=false, timer=null
// Deep-link the current card via the URL hash (#DEN or #18) so reload / share reopens it.
function idxFromHash(){
  const raw=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim()
  if(!raw) return 0
  const t=DECK.findIndex(c=>c.kind==='team'&&c.abbr===raw.toUpperCase()); if(t>=0) return t
  const p=DECK.findIndex(c=>c.id===raw); if(p>=0) return p
  const n=parseInt(raw,10); if(!isNaN(n)&&n>=1&&n<=DECK.length) return n-1
  return 0
}
function render(){
  track.style.transform=`translateX(${-idx*100}%)`
  const c=DECK[idx]; if(!c) return
  const isT=c.kind==='team', t=isT?TEAMS[c.abbr]:TEAMS[c.team]
  $('count').querySelector('.crumb').innerHTML=`<b>${idx+1}</b> / ${DECK.length}`
  $('pname').textContent=c.name
  $('pdot').style.background=(t&&t.primary)||'#888'
  $('b-prev').disabled=idx===0; $('b-next').disabled=idx===DECK.length-1
  ;[...track.children].forEach((n,i)=>n.classList.toggle('live',Math.abs(i-idx)<=1))
  // the section tab for whatever we are looking at
  ;[...document.querySelectorAll('.sectab')].forEach(b=>
    b.classList.toggle('on', b.dataset.kind===c.kind))
  ;[...document.querySelectorAll('.grptab')].forEach(b=>
    b.classList.toggle('on', b.dataset.group===c.group))
  const want='#'+(isT?c.abbr:c.id); if(location.hash!==want) history.replaceState(null,'',want)
}
function go(i){ idx=Math.max(0,Math.min(DECK.length-1,i)); render() }
function setPlay(p){ playing=p
  $('b-play').innerHTML = p
    ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg>'
  clearInterval(timer)
  if(p) timer=setInterval(()=>{ if(idx>=DECK.length-1){setPlay(false);return} go(idx+1) },3500) }
$('b-prev').onclick=()=>{setPlay(false);go(idx-1)}
$('b-next').onclick=()=>{setPlay(false);go(idx+1)}
$('b-first').onclick=()=>{setPlay(false);go(0)}
$('b-play').onclick=()=>setPlay(!playing)

/* Season / Players / Clubs -- Season is the towers page this film hangs off, so it is a
   link out, exactly as the NBA film's strip leads with its towers view. */
function buildTabs(){
  const bar=$('sectabs'); if(!bar) return
  bar.innerHTML=''
  const home=el('a','sectab link'); home.textContent='Season ↗'
  home.href='./index.html'; home.title='Season Tower — all 32 clubs at once'
  bar.appendChild(home)
  ;[['Players','player',()=>firstOf('player')],['Clubs','team',()=>firstOf('team')]]
    .forEach(([lab,kind,at])=>{
      const b=el('button','sectab'); b.textContent=lab; b.dataset.kind=kind
      b.onclick=()=>{ setPlay(false); go(at()) }
      bar.appendChild(b)
    })
  // one chip per position group, so a reader can land straight on the receivers
  PLAYERS.groups.forEach(g=>{
    const b=el('button','grptab'); b.textContent=g.label; b.title=`${g.ids.length} cards`
    b.dataset.group=g.key
    b.onclick=()=>{ setPlay(false); go(firstGroup(g.key)) }
    bar.appendChild(b)
  })
  const cred=el('div','tb-cred')
  cred.innerHTML='Produced with passion by A guy with a scarf (Carlo De Marchis) \u00b7 '
    +'<a href="#" onclick="openCredits();return false">Credits</a>'
  bar.appendChild(cred)
}

/* ---- modals: jump, help, more, credits (the family's chrome) ---- */
function openModal(id){ setPlay(false); $(id).classList.add('on') }
window.closeModal=id=>$(id).classList.remove('on')
function closeMods(){ document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on')) }
document.querySelectorAll('.modal').forEach(m=>
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('on') }))

/* Every card searchable by name, club, position and section: with 205 cards a list you
   scroll is no use -- the one you want is the one you can type. */
let INDEX=[]
function buildIndex(){
  INDEX=DECK.map((c,i)=>{
    const isT=c.kind==='team', t=isT?TEAMS[c.abbr]:TEAMS[c.team]
    return { n:i+1, name:c.name, colour:(t&&t.primary)||'#888',
      meta:isT ? `${t.conf} ${DIVNAME[t.div]||t.div} · ${rec(stat[c.abbr])}`
               : `${c.label} · #${c.rank} · ${c.team}`,
      hay:(isT ? `${c.name} ${c.abbr} clubs teams ${t.conf} ${DIVNAME[t.div]||''}`
               : `${c.name} ${c.team} ${c.label} ${(PLAYERS.players[c.id]||{}).pos||''}`).toLowerCase() }
  })
}
let jSel=0
function jMatches(){
  const q=$('jq').value.trim().toLowerCase()
  if(!q) return INDEX
  if(/^\d+$/.test(q)) return INDEX.filter(r=>String(r.n).startsWith(q)).slice(0,60)
  return INDEX.filter(r=>r.hay.includes(q)).slice(0,60)
}
function jRender(rows){
  $('jlist').innerHTML = rows.map((r,i)=>
    `<div class="jrow ${i===jSel?'sel':''}" data-n="${r.n}"><span class="jn">${r.n}</span>`
    +`<span class="jd" style="background:${r.colour}"></span>`
    +`<span><b>${r.name}</b></span><span class="jt">${r.meta}</span></div>`).join('')
    || `<div class="jrow"><span class="jn">—</span><span class="jd"></span><span>No card matches that.</span><span></span></div>`
}
function openJump(){
  buildIndex(); jSel=0
  const q=$('jq'); q.value=''; jRender(INDEX)
  openModal('jmodal'); setTimeout(()=>q.focus(),40)
  const cur=$('jlist').children[idx]; if(cur) cur.scrollIntoView({block:'nearest'})
}
$('jq').addEventListener('input',()=>{ jSel=0; jRender(jMatches()) })
$('jq').addEventListener('keydown',e=>{
  const rows=jMatches()
  if(e.key==='ArrowDown'){ e.preventDefault(); jSel=Math.min(rows.length-1,jSel+1); jRender(rows)
    document.querySelector('.jrow.sel')?.scrollIntoView({block:'nearest'}) }
  if(e.key==='ArrowUp'){ e.preventDefault(); jSel=Math.max(0,jSel-1); jRender(rows)
    document.querySelector('.jrow.sel')?.scrollIntoView({block:'nearest'}) }
  if(e.key==='Enter'&&rows[jSel]){ closeModal('jmodal'); go(rows[jSel].n-1) }
})
$('jlist').addEventListener('click',e=>{
  const row=e.target.closest('.jrow[data-n]')
  if(row){ closeModal('jmodal'); go(+row.dataset.n-1) }
})

  const nP=Object.keys(PLAYERS.players).length
  $('hbody').innerHTML=`
    <h3>How to watch</h3>
    <p>This is a film, not a page. ${DECK.length} cards: ${nP} players in seven position

    <h5>Navigate</h5>

      <li><b>g</b> or <b>/</b> &mdash; jump to any card by name or number (or click the counter)</li>

      <li>On a touchscreen, <b>swipe</b> left and right</li>

  openModal('hmodal')
}
window.openCredits=function(){
  $('cbody').innerHTML=`
    <h3>Credits</h3>
    <p>Produced with passion by <a href="https://aguywithascarf.substack.com/" target="_blank"
      rel="noopener">A guy with a scarf</a> (Carlo De Marchis).</p>

$('count').onclick=openJump
$('b-help').onclick=openHelp
$('b-more').onclick=()=>openModal('mmodal')

/* roster category tabs (global — one delegated handler for all cards) */
document.documentElement.setAttribute('data-rtab','offense')
track.addEventListener('click',e=>{ const t=e.target.closest('.rtab'); if(t) document.documentElement.setAttribute('data-rtab', t.dataset.tab) })

/* fullscreen */
function toggleFs(){ const d=document; if(d.fullscreenElement){ d.exitFullscreen&&d.exitFullscreen() } else { d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen() } }
$('b-full').onclick=toggleFs

addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeMods(); return }
  if(document.querySelector('.modal.on')) return      // the jump field owns the keyboard
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();setPlay(false);go(idx+1)}
  else if(e.key==='ArrowLeft'){setPlay(false);go(idx-1)}
  else if(e.key==='Home'){setPlay(false);go(0)}
  else if(e.key==='End'){setPlay(false);go(DECK.length-1)}
  else if(e.key==='g'||e.key==='/'){e.preventDefault();openJump()}
  else if(e.key==='h'||e.key==='?'){openHelp()}
  else if(e.key==='f'||e.key==='F'){toggleFs()}
})
let x0=null
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true})
addEventListener('touchend',e=>{ if(x0==null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50){setPlay(false);go(idx+(dx<0?1:-1))} x0=null },{passive:true})

// back/forward or a manually edited hash re-syncs the deck
addEventListener('hashchange',()=>{ const i=idxFromHash(); if(i!==idx){ setPlay(false); idx=i; render() } })

/* ---- match-week selector (later weeks simulated) ---- */
const wk=$('wk')
for(let w=MAXW; w>=1; w--){ const o=document.createElement('option'); o.value=w; o.textContent=w>=MAXW?'Full':('Wk '+w); wk.appendChild(o) }
wk.value=MAXW
function rebuild(week){
  computeStats(week); buildDeck(); buildTabs(); render()   // frozen order — stay on the current card
}
wk.onchange=()=>{ setPlay(false); rebuild(+wk.value) }

computeStats(MAXW); freezeRanking()    // ranking + seeds frozen from the full season
buildDeck(); buildTabs()
idx=idxFromHash()
render()
</script>
