<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NFL · Season Film</title>
<meta name="robots" content="noindex" />
<!-- The Season Film is now two films: players.html and clubs.html. Old links forward
     here: a club code (#KC, #teams) goes to Clubs, anything else to Players. -->
<script>
  var h = location.hash.slice(1);
  var clubs = /^[A-Za-z]{2,3}$/.test(h) || /^(teams|clubs)$/i.test(h);
  var keep = h && !/^(teams|clubs|players)$/i.test(h) && !/^\d{1,3}$/.test(h);
  location.replace((clubs ? './clubs.html' : './players.html') + (keep ? '#' + h : ''));
</script>
</head>
<body></body>
</html>
